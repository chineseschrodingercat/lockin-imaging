[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "lockin-imaging"
version = "0.1.0"
description = "Exposure-aware, chunked I/Q demodulation for fluorescence image stacks"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Minhao Liu"}]
license = "LicenseRef-Proprietary"
license-files = ["RIGHTS.md"]
dependencies = ["numpy>=1.26,<3"]
keywords = ["lock-in", "fluorescence", "scientific-computing", "signal-processing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
]

[project.optional-dependencies]
demo = ["matplotlib>=3.9,<4"]
dev = ["matplotlib>=3.9,<4", "pytest>=8,<9", "ruff>=0.12,<0.13", "build>=1.2,<2"]

[project.scripts]
lockin-imaging = "lockin_imaging.cli:main"

[project.urls]
Repository = "https://github.com/chineseschrodingercat/lockin-imaging"
Documentation = "https://github.com/chineseschrodingercat/lockin-imaging/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
